# ZMK feature switches for the splitkb.com Aurora Sofle, shared by every build.
# Lines starting with # are off or notes. See GUIDE.md for what each one does.

### BLUETOOTH
# Boost TX power for a stronger connection
CONFIG_BT_CTLR_TX_PWR_PLUS_8=y
CONFIG_ZMK_BLE_EXPERIMENTAL_FEATURES=y
# Connection stability tweaks (pairing timing, newer LLCP, no 2M PHY).
# Helps with Windows 11 connection issues.
CONFIG_ZMK_BLE_EXPERIMENTAL_CONN=y
# CONFIG_BT_MAX_CONN=3

### POWER
CONFIG_ZMK_SLEEP=y
CONFIG_ZMK_EXT_POWER=y
# Idle timeout before the idle state, in ms (1 min)
# CONFIG_ZMK_IDLE_TIMEOUT=60000
# Deep sleep timeout, in ms (15 min)
# CONFIG_ZMK_IDLE_SLEEP_TIMEOUT=900000
# Disable external power when not connected to USB
# CONFIG_ZMK_EXT_POWER_USB_ONLY=y

### CIRQUE TRACKPAD (optional)
# Uncomment together with the cirque-input-module block in config/west.yml and
# the trackpad block in the half overlay.
# CONFIG_ZMK_POINTING=y
# CONFIG_ZMK_POINTING_SMOOTH_SCROLLING=y
# CONFIG_INPUT=y
# I2C wiring (Option A in the overlay): the OLED bus already sets CONFIG_I2C=y.
# For SPI wiring (Option B) add instead:
# CONFIG_SPI=y
# Larger input thread stack, recommended by the driver:
# CONFIG_INPUT_THREAD_STACK_SIZE=4096

### ZMK STUDIO
# https://zmk.dev/docs/config/studio
CONFIG_ZMK_STUDIO=y
CONFIG_ZMK_STUDIO_LOCKING=n

### RGB UNDERGLOW
CONFIG_ZMK_RGB_UNDERGLOW=y
CONFIG_WS2812_STRIP=y
# Turn underglow off when the keyboard goes idle
CONFIG_ZMK_RGB_UNDERGLOW_AUTO_OFF_IDLE=y
# Boot effect: 0 solid, 1 breathe, 2 spectrum, 3 swirl
CONFIG_ZMK_RGB_UNDERGLOW_EFF_START=3
# Step sizes for RGB actions (hue in degrees, others in percent)
CONFIG_ZMK_RGB_UNDERGLOW_HUE_STEP=30
CONFIG_ZMK_RGB_UNDERGLOW_SAT_STEP=2
CONFIG_ZMK_RGB_UNDERGLOW_BRT_STEP=1
# Boot color and brightness
CONFIG_ZMK_RGB_UNDERGLOW_HUE_START=240
CONFIG_ZMK_RGB_UNDERGLOW_SAT_START=10
CONFIG_ZMK_RGB_UNDERGLOW_BRT_START=15
# By default toggling underglow also toggles external power, which turns the
# OLED off too. Keep them independent.
CONFIG_ZMK_RGB_UNDERGLOW_EXT_POWER=n

### OLED DISPLAY
# Halves use the nice_oled portrait status screen (OLEDs are mounted vertically).
# In the dongle setup the dongle's 128x64 screen comes from the dongle_display module.
CONFIG_ZMK_DISPLAY=y
CONFIG_ZMK_DISPLAY_STATUS_SCREEN_CUSTOM=y
# CONFIG_ZMK_WIDGET_WPM_STATUS=n
# CONFIG_ZMK_WIDGET_BATTERY_STATUS_SHOW_PERCENTAGE=y

## nice_oled screen options. Each line shows the non-default value; uncomment to apply.
## Both screens
# CONFIG_NICE_OLED_WIDGET_INVERTED=y
# CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_IDLE=y
# CONFIG_NICE_OLED_SHOW_SLEEP_ART_ON_SLEEP=y

## Left screen (central status). Layer, WPM, modifiers and caps lock are on by default.
# CONFIG_NICE_OLED_WIDGET_LAYER=n
# CONFIG_NICE_OLED_WIDGET_PROFILE_BIG=y
# CONFIG_NICE_OLED_WIDGET_MODIFIERS_INDICATORS=n
# CONFIG_NICE_OLED_WIDGET_HID_INDICATORS=n
# CONFIG_NICE_OLED_WIDGET_WPM=n
# WPM style. Bongo cat is the default; set it to n when picking Luna.
# CONFIG_NICE_OLED_WIDGET_WPM_BONGO_CAT=n
# CONFIG_NICE_OLED_WIDGET_WPM_LUNA=y
# CONFIG_NICE_OLED_WIDGET_WPM_NUMBER=y
# CONFIG_NICE_OLED_WIDGET_WPM_SPEEDOMETER=y
# CONFIG_NICE_OLED_WIDGET_WPM_GRAPH=y

## Right screen (peripheral). Cat animation is the default; set CAT=n when picking another.
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_CAT=n
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_GEM=y
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_HEAD=y
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_POKEMON=y
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_SPACEMAN=y
# Full loop length in ms
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL_MS=10000
# Static Vim image instead of an animation
# CONFIG_NICE_OLED_WIDGET_ANIMATION_PERIPHERAL=n
# CONFIG_NICE_OLED_WIDGET_STATIC_IMAGE_PERIPHERAL_VIM=y

### ENCODER
CONFIG_EC11=y
CONFIG_EC11_TRIGGER_GLOBAL_THREAD=y

### KEY SCAN
# Eager debouncing to lower input lag
CONFIG_ZMK_KSCAN_DEBOUNCE_PRESS_MS=1
CONFIG_ZMK_KSCAN_DEBOUNCE_RELEASE_MS=5

### HID
# Improves compatibility with iPad. https://zmk.dev/docs/config/system#hid
CONFIG_ZMK_HID_CONSUMER_REPORT_USAGES_BASIC=y
# RDP compatibility
# CONFIG_ZMK_HID_SEPARATE_MOD_RELEASE_REPORT=y
# NKRO
# CONFIG_ZMK_HID_REPORT_TYPE_NKRO=y
# Enable F13-F24
# CONFIG_ZMK_HID_KEYBOARD_NKRO_EXTENDED_REPORT=y

### DEBUG
# CONFIG_ZMK_USB_LOGGING=y
# CONFIG_LOG_PROCESS_THREAD_STARTUP_DELAY_MS=8000
