# GitHub Actions build matrix for the splitkb.com Aurora Sofle (dongle setup).
#
# Layout:
#   - Dongle (nice_nano_v2) is the BLE central and drives the 128x64 OLED.
#   - Both halves are peripherals, each with its own 128x32 OLED.
#   - settings_reset clears bonds when re-pairing.
---
include:
  # Dongle / central - nice_nano_v2 + 128x64 OLED
  - board: nice_nano_v2
    shield: splitkb_aurora_sofle_dongle_pro_micro dongle_display
    cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"Aurora Dongle\" -DCONFIG_ZMK_STUDIO=y
    artifact-name: aurora_sofle_dongle
    snippet: studio-rpc-usb-uart

  # Left half - peripheral + 128x32 OLED
  - board: nice_nano_v2
    shield: splitkb_aurora_sofle_left_peripheral
    artifact-name: aurora_sofle_left

  # Right half - peripheral + 128x32 OLED + encoder
  - board: nice_nano_v2
    shield: splitkb_aurora_sofle_right
    artifact-name: aurora_sofle_right

  # Settings reset (flash to a half to clear BLE bonds when re-pairing)
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: aurora_sofle_settings_reset
