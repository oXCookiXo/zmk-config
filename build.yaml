# GitHub Actions build matrix for the splitkb.com Aurora Sofle (2-half setup).
#
# Layout:
#   - Left half (nice_nano_v2) is the BLE central, 128x32 OLED + encoder.
#   - Right half is the peripheral, 128x32 OLED + encoder.
#   - settings_reset clears bonds when re-pairing.
#
# For the 3-controller dongle setup later: comment out the left entry and
# uncomment the dongle + left_peripheral entries below.
---
include:
  # Left half - central + 128x32 OLED + encoder
  - board: nice_nano_v2
    shield: splitkb_aurora_sofle_left nice_oled
    cmake-args: -DCONFIG_ZMK_STUDIO=y
    artifact-name: aurora_sofle_left
    snippet: studio-rpc-usb-uart

  # Right half - peripheral + 128x32 OLED + encoder
  - board: nice_nano_v2
    shield: splitkb_aurora_sofle_right nice_oled
    artifact-name: aurora_sofle_right

  # Settings reset (flash to a half to clear BLE bonds when re-pairing)
  - board: nice_nano_v2
    shield: settings_reset
    artifact-name: aurora_sofle_settings_reset

  # ---- Dongle setup (3 controllers) ----
  # Dongle / central - nice_nano_v2 + 128x64 OLED
  # - board: nice_nano_v2
  #   shield: splitkb_aurora_sofle_dongle_pro_micro dongle_display
  #   cmake-args: -DCONFIG_ZMK_KEYBOARD_NAME=\"AuroraDongle\" -DCONFIG_ZMK_STUDIO=y
  #   artifact-name: aurora_sofle_dongle
  #   snippet: studio-rpc-usb-uart

  # Left half - peripheral + 128x32 OLED
  # - board: nice_nano_v2
  #   shield: splitkb_aurora_sofle_left_peripheral
  #   artifact-name: aurora_sofle_left_peripheral
